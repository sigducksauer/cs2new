name: CS2 Update Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last seen ID
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: last_news_id.txt
          key: cs2-last-id-${{ github.run_id }}
          restore-keys: |
            cs2-last-id-

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Save last seen ID
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_news_id.txt
          key: cs2-last-id-${{ github.run_id }}
